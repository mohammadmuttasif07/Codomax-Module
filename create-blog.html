<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogHub - Create Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-blue-600 text-white p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">BlogHub</h1>

        <div class="space-x-4">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-10">

    <div class="bg-white p-8 rounded-xl shadow">

        <h2 class="text-3xl font-bold mb-6 text-center">
            Create New Blog
        </h2>

        <form onsubmit="createBlog(event)">

            <label class="block font-semibold mb-2">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                required
                class="w-full border rounded-lg p-3 mb-5 focus:ring-2 focus:ring-blue-500"
                placeholder="Enter blog title">

            <label class="block font-semibold mb-2">
                Category
            </label>

            <select
                id="category"
                class="w-full border rounded-lg p-3 mb-5">

                <option>Technology</option>
                <option>Education</option>
                <option>Travel</option>
                <option>Lifestyle</option>
                <option>Other</option>

            </select>

            <label class="block font-semibold mb-2">
                Blog Content
            </label>

            <textarea
                id="content"
                required
                rows="8"
                class="w-full border rounded-lg p-3 mb-5 focus:ring-2 focus:ring-blue-500"
                placeholder="Write your blog here..."></textarea>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                Publish Blog
            </button>

        </form>

    </div>

</div>

<script>
function createBlog(event) {

    event.preventDefault();

    let title = document.getElementById("title").value;
    let category = document.getElementById("category").value;
    let content = document.getElementById("content").value;

    if (title && content) {

        localStorage.setItem("blogTitle", title);
        localStorage.setItem("blogCategory", category);
        localStorage.setItem("blogContent", content);

        alert("Blog published successfully!");

        window.location.href = "dashboard.html";
    }
}
</script>

</body>
</html>
