<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlogHub — Create Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="mast">
  <div class="wrap">
    <a href="index.html" class="brand">Blog<em>Hub</em></a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </div>
</header>

<main class="wrap view">
  <div style="max-width:560px;margin:0 auto">
    <h2 style="font-size:2.1rem;margin-bottom:8px">Write a new post</h2>
    <p style="color:var(--ink-soft);margin:0 0 34px">Say something worth reading. You can edit later from your dashboard.</p>
    <form id="blogForm">
      <div class="field"><label for="cb-title">Title</label><input type="text" id="cb-title" required placeholder="A title readers will remember"></div>
      <div class="field"><label for="cb-cat">Category</label>
        <select id="cb-cat">
          <option>Technology</option><option>Education</option><option>Travel</option><option>Lifestyle</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label for="cb-content">Content</label><textarea id="cb-content" required placeholder="Start writing..."></textarea></div>
      <button type="submit" class="btn" style="width:100%">Publish post</button>
    </form>
  </div>
</main>

<footer class="wrap"><span>© 2026 BlogHub. All rights reserved.</span><span>Created by Mohd Muttasif</span></footer>

<script src="app.js"></script>
<script>
document.getElementById('blogForm').addEventListener('submit', e=>{
  e.preventDefault();
  const title = document.getElementById('cb-title').value.trim();
  const category = document.getElementById('cb-cat').value;
  const content = document.getElementById('cb-content').value.trim();
  if(!title||!content) return;
  const posts = loadPosts();
  posts.unshift({id:'p'+Date.now(), title, category, content});
  savePosts(posts);
  alert('Blog published successfully!');
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
