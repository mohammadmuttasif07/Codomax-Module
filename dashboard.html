<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlogHub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="mast">
  <div class="wrap">
    <a href="index.html" class="brand">Blog<em>Hub</em></a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="dashboard.html" class="active">Dashboard</a>
    </nav>
  </div>
</header>

<main class="wrap view">
  <div class="hero" style="align-items:center">
    <div>
      <h1 style="font-size:2.4rem">Your dashboard</h1>
      <p class="lede">Manage what you've published and pick up drafts.</p>
    </div>
    <div style="text-align:right"><a href="create-blog.html" class="btn">+ New post</a></div>
  </div>
  <div class="section-head"><h2>My posts</h2><span class="pill" id="dashCountPill">0 posts</span></div>
  <div id="dashFeed" class="grid"></div>
</main>

<footer class="wrap"><span>© 2026 BlogHub. All rights reserved.</span><span>Created by Mohd Muttasif</span></footer>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
let posts = loadPosts();
function render(){
  document.getElementById('dashCountPill').textContent = posts.length + (posts.length===1?' post':' posts');
  const dash = document.getElementById('dashFeed');
  dash.innerHTML = posts.length
    ? posts.map(p=>renderCard(p,true)).join('')
    : '<p class="empty">Nothing here yet. <a href="create-blog.html" style="color:var(--brick)">Write your first post →</a></p>';
  wireDelete(dash, posts, updated=>{ posts = updated; render(); showToast('Post deleted'); });
}
render();
</script>
</body>
</html>
