<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogHub - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-blue-600 text-white p-4">
    <div class="max-w-6xl mx-auto flex justify-between">
        <h1 class="text-2xl font-bold">BlogHub</h1>
        <a href="index.html" class="hover:text-gray-200">Home</a>
    </div>
</nav>

<div class="min-h-screen flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

        <h2 class="text-3xl font-bold text-center mb-6">
            Create Account
        </h2>

        <form onsubmit="registerUser(event)">

            <label class="block mb-2 font-semibold">Full Name</label>
            <input
                type="text"
                id="name"
                required
                class="w-full border rounded-lg p-3 mb-4"
                placeholder="Enter your name">

            <label class="block mb-2 font-semibold">Email</label>
            <input
                type="email"
                id="email"
                required
                class="w-full border rounded-lg p-3 mb-4"
                placeholder="Enter your email">

            <label class="block mb-2 font-semibold">Password</label>
            <input
                type="password"
                id="password"
                required
                minlength="6"
                class="w-full border rounded-lg p-3 mb-5"
                placeholder="Enter password">

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                Register
            </button>

        </form>

        <p class="text-center mt-5">
            Already have an account?
            <a href="login.html" class="text-blue-600 font-semibold">
                Login
            </a>
        </p>

    </div>
</div>

<script>
function registerUser(event) {
    event.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (name && email && password.length >= 6) {
        alert("Registration successful!");
        window.location.href = "login.html";
    }
}
</script>

</body>
</html>
